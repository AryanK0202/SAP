- name: "CHECK: Failed systemd Units"
  block:
    - name: "COLLECT: Failed systemd units"
      ansible.builtin.shell: |
        set -o pipefail
        "{{ ansible_python_interpreter | default('/usr/bin/python3') }}" - <<'PY'
        import json
        import os
        import shutil
        import subprocess

        critical = set(json.loads(os.environ.get("CRITICAL_UNITS_JSON", "[]")))
        systemctl = shutil.which("systemctl")
        if systemctl:
            result = subprocess.run([systemctl, "--failed", "--no-legend", "--plain"], text=True, capture_output=True, check=False)
            lines = [line.strip() for line in result.stdout.splitlines() if line.strip()]
            names = {line.split()[0] for line in lines if line.split()}
            critical_failed = sorted(names.intersection(critical))
            status = "RED" if critical_failed else "YELLOW" if lines or result.returncode != 0 else "GREEN"
            observed = f"{len(lines)} failed unit(s)"
            details = "; ".join(lines[:10]) if lines else (result.stderr.strip() or "No failed units reported.")
        else:
            status = "YELLOW"
            observed = "systemctl unavailable"
            details = "Failed service status could not be collected."
        print(json.dumps([{
            "category": "Operating System", "name": "Failed systemd Units", "status": status,
            "observed": observed, "details": details, "source": "collect_os_health.yml",
        }]))
        PY
      args:
        executable: /bin/bash
      environment:
        CRITICAL_UNITS_JSON: "{{ prepatch_critical_systemd_units | default([]) | to_json }}"
      register: prepatch_failed_systemd_units_raw
      changed_when: false
      failed_when: false

    - name: "STATUS: Add failed systemd units result"
      ansible.builtin.set_fact:
        prepatch_services: >-
          {{ prepatch_services + (prepatch_failed_systemd_units_raw.stdout | from_json if prepatch_failed_systemd_units_raw.rc | default(1) | int == 0 and prepatch_failed_systemd_units_raw.stdout | default('') | trim | length > 0 else [{'category':'Operating System','name':'Failed systemd Units','status':'RED','observed':'collection failed','details':prepatch_failed_systemd_units_raw.stderr | default('No output', true) | trim,'source':'collect_os_health.yml'}]) }}
  tags: [prepatch_failed_systemd_units]
