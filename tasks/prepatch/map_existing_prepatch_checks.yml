    group_status: >-
      {{
        'RED' if group_missing and group_required
        else 'YELLOW' if group_missing
        else 'GREEN'
      }}
    group_details: >-
      {{
        'Required SAP operating-system group is missing.'
        if group_missing and group_required
        else 'Optional SAP operating-system group was not found.'
        if group_missing
