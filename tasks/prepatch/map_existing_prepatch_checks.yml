---
- name: "STATUS: Add Ansible connectivity result"
  ansible.builtin.set_fact:
    prepatch_services: >-
      {{
        prepatch_services
        + [
            {
              'category': 'Connectivity',
              'name': 'Ansible Connectivity',
              'status': connectivity_status,
              'observed': connectivity_observed,
              'details': connectivity_details,
              'source': 'collect_basic_info.yml'
            }
          ]
      }}
  vars:
    connectivity_ok: >-
      {{
        login_check is defined
        and login_check.ping | default('') == 'pong'
      }}
    connectivity_status: "{{ 'GREEN' if connectivity_ok else 'RED' }}"
    connectivity_observed: "{{ 'pong' if connectivity_ok else 'no successful ping result' }}"
    connectivity_details: >-
      {{
        'Ansible successfully contacted the host.'
        if connectivity_ok
        else 'The existing connectivity check did not return pong.'
      }}
  when: login_check is defined
  tags: [prepatch_ansible_connectivity]

- name: "STATUS: Add required SAP operating-system users"
  ansible.builtin.set_fact:
    prepatch_services: >-
      {{
        prepatch_services
        + [
            {
              'category': 'SAP OS Identity',
              'name': 'OS user ' ~ item,
              'status': user_status,
              'observed': user_value,
              'details': user_details,
              'source': 'collect_users_groups.yml'
            }
          ]
      }}
  vars:
    user_map: >-
      {{
        dict(user_id_check.stdout_lines | default([]) | map('split', ':', 1) | list)
      }}
    user_value: "{{ user_map[item] | default('NOT COLLECTED') }}"
    user_required: "{{ item in (prepatch_required_users | default([])) }}"
    user_missing: "{{ user_value in ['MISSING', 'NOT COLLECTED'] }}"
    user_status: >-
      {{
        'RED' if user_missing and user_required
        else 'YELLOW' if user_missing
        else 'GREEN'
      }}
    user_details: >-
      {{
        'Required SAP operating-system user is missing.'
        if user_missing and user_required
        else 'Optional SAP operating-system user was not found.'
        if user_missing
        else 'User exists; observed UID is ' ~ user_value ~ '.'
      }}
  loop: "{{ validation_users | default([]) }}"
  when: user_id_check is defined
  tags: [prepatch_os_users]

- name: "STATUS: Add required SAP operating-system groups"
  ansible.builtin.set_fact:
    prepatch_services: >-
      {{
        prepatch_services
