---
- name: "CHECK: ClamSAP package status"
  ansible.builtin.shell: |
    set -o pipefail
    found=0

    for pkg in {{ clamsap_package_names | join(' ') }}; do
      if command -v dpkg >/dev/null 2>&1; then
        if dpkg -s "$pkg" >/dev/null 2>&1; then
          echo "$pkg:installed"
          found=1
        fi
      elif command -v rpm >/dev/null 2>&1; then
        if rpm -q "$pkg" >/dev/null 2>&1; then
          echo "$pkg:installed"
          found=1
        fi
      fi
    done

    if [ "$found" -eq 0 ]; then
      echo "MISSING"
    fi
  args:
    executable: /bin/bash
  register: clamsap_package_check
  changed_when: false
  failed_when: false
  tags: [prepatch_clamsap]

- name: "CHECK: ClamSAP service/process status"
  ansible.builtin.shell: |
    set -o pipefail

    if command -v systemctl >/dev/null 2>&1; then
      systemctl is-active clamsap 2>/dev/null || true
    fi

    ps -ef | grep -i '[c]lamsap' || true
  args:
    executable: /bin/bash
  register: clamsap_runtime_check
  changed_when: false
  failed_when: false
  tags: [prepatch_clamsap]

- name: "CHECK: Gather installed package information"
  ansible.builtin.package_facts:
    manager: auto
  register: prepatch_package_facts_result
  changed_when: false
  ignore_errors: "{{ not (hana_strict_validation | default(false) | bool) }}"
  tags: [prepatch_clamav]

- name: "ERROR: Record package inventory collection failure"
  ansible.builtin.set_fact:
    prepatch_services: >-
      {{
        prepatch_services
        + [{
            'category': 'Security Services',
            'name': 'ClamAV Package Inventory Collection',
            'status': 'ERROR',
            'observed': 'collection failed',
            'details': prepatch_package_facts_result.msg
                       | default('package_facts failed without an error message', true),
            'source': 'collect_package_info.yml'
          }]
      }}
  when: prepatch_package_facts_result.failed | default(false) | bool
  tags: [prepatch_clamav]

- name: "CHECK: Gather service information"
  ansible.builtin.service_facts:
  register: prepatch_service_facts_result
  changed_when: false
  ignore_errors: "{{ not (hana_strict_validation | default(false) | bool) }}"
  tags: [prepatch_clamav]

- name: "ERROR: Record service inventory collection failure"
  ansible.builtin.set_fact:
    prepatch_services: >-
      {{
        prepatch_services
        + [{
            'category': 'Security Services',
            'name': 'ClamAV Service Inventory Collection',
            'status': 'ERROR',
            'observed': 'collection failed',
            'details': prepatch_service_facts_result.msg
                       | default('service_facts failed without an error message', true),
            'source': 'collect_package_info.yml'
          }]
      }}
  when: prepatch_service_facts_result.failed | default(false) | bool
  tags: [prepatch_clamav]

- name: "FACT: Detect installed ClamAV packages"
  ansible.builtin.set_fact:
    clamav_installed_packages: >-
      {{
        (clamav_package_names | default(['clamav', 'clamav-daemon', 'clamav-server']))
        | select('in', (ansible_facts.packages | default({})).keys() | list)
        | list
      }}
  when: not (prepatch_package_facts_result.failed | default(false) | bool)
  tags: [prepatch_clamav]

- name: "FACT: Detect ClamAV daemon services"
  ansible.builtin.set_fact:
    clamav_detected_services: >-
      {{
        (clamav_service_names | default(['clamd.service', 'clamd@scan.service', 'clamav-daemon.service']))
        | select('in', (ansible_facts.services | default({})).keys() | list)
        | list
      }}
  when: not (prepatch_service_facts_result.failed | default(false) | bool)
  tags: [prepatch_clamav]

- name: "FACT: Initialize ClamAV service results"
  ansible.builtin.set_fact:
    clamav_service_results: []
  tags: [prepatch_clamav]

- name: "FACT: Collect ClamAV daemon service states"
  ansible.builtin.set_fact:
    clamav_service_results: >-
      {{
        clamav_service_results
        +
        [
          {
            'name': item,
            'enabled': ansible_facts.services[item].status
                       | default('unknown'),
            'state': ansible_facts.services[item].state
                     | default('unknown')
          }
        ]
      }}
  loop: "{{ clamav_detected_services | default([]) }}"
  when: not (prepatch_service_facts_result.failed | default(false) | bool)
  tags: [prepatch_clamav]

- name: "FACT: Determine ClamAV validation status"
  ansible.builtin.set_fact:
    clamav_installed: "{{ clamav_installed_packages | length > 0 }}"
    clamav_service_found: "{{ clamav_detected_services | length > 0 }}"
    clamav_service_enabled: >-
      {{
        clamav_service_results
        | selectattr('enabled', 'equalto', 'enabled')
        | list
        | length > 0
      }}
    clamav_service_running: >-
      {{
        clamav_service_results
        | selectattr('state', 'equalto', 'running')
        | list
        | length > 0
      }}
  when:
    - not (prepatch_package_facts_result.failed | default(false) | bool)
    - not (prepatch_service_facts_result.failed | default(false) | bool)
  tags: [prepatch_clamav]

- name: "FACT: Set overall ClamAV daemon validation result"
  ansible.builtin.set_fact:
    clamav_validation_passed: >-
      {{
        clamav_installed
        and clamav_service_found
        and clamav_service_enabled
        and clamav_service_running
      }}
  when:
    - not (prepatch_package_facts_result.failed | default(false) | bool)
    - not (prepatch_service_facts_result.failed | default(false) | bool)
  tags: [prepatch_clamav]

- name: "CHECK: Watchman package status"
  ansible.builtin.shell: |
    set -o pipefail
    found=0

    for pkg in {{ watchman_package_names | join(' ') }}; do
      if command -v dpkg >/dev/null 2>&1; then
        if dpkg -s "$pkg" >/dev/null 2>&1; then
          echo "$pkg:installed"
          found=1
        fi
      elif command -v rpm >/dev/null 2>&1; then
        if rpm -q "$pkg" >/dev/null 2>&1; then
          echo "$pkg:installed"
          found=1
        fi
      fi
    done

    if [ "$found" -eq 0 ]; then
      echo "MISSING"
    fi
  args:
    executable: /bin/bash
  register: watchman_package_check
  changed_when: false
  failed_when: false
  tags: [prepatch_watchman]

- name: "CHECK: Watchman service/process status"
  ansible.builtin.shell: |
    set -o pipefail

    if command -v systemctl >/dev/null 2>&1; then
      systemctl is-active watchman@root.service 2>/dev/null || true
      systemctl is-active watchman@root.socket 2>/dev/null || true
    fi

    ps -ef | grep -i '[w]atchman' || true
  args:
    executable: /bin/bash
  register: watchman_runtime_check
  changed_when: false
  failed_when: false
  tags: [prepatch_watchman]
