---
# This file only adds fields to db_validation_data
# for task groups that were actually selected in ansible_run_tags. That keeps
# the report clean when users run a subset such as --tags packages or --tags hana.

- name: "FACT: Initialize normalized validation data"
  ansible.builtin.set_fact:
    db_validation_data:
      inventory_hostname: "{{ inventory_hostname }}"
      ansible_host: "{{ ansible_host | default(inventory_hostname) }}"

- name: "FACT: Add basic/filesystem/host data"
  ansible.builtin.set_fact:
    db_validation_data: >-
      {{
        db_validation_data
        | combine({
            'hostname': hostname_check.stdout | trim,
            'mounts': mount_check.stdout_lines | default([]),
            'expected_shared_mounts': shared_mount_list,
            'mount_points': mount_check.stdout_lines | default([]) | map('split') | map('first') | list,
            'etc_hosts': etc_hosts_check.stdout | default(''),
            'os': (ansible_distribution | default('UNKNOWN')) ~ ' ' ~ (ansible_distribution_version | default('')),
            'kernel': ansible_kernel | default('UNKNOWN'),
            'architecture': ansible_architecture | default('UNKNOWN')
          })
      }}
  when:
    - "'all' in (ansible_run_tags | default(['all'])) or 'collect' in (ansible_run_tags | default([])) or 'basic' in (ansible_run_tags | default([])) or 'filesystems' in (ansible_run_tags | default([])) or 'hosts' in (ansible_run_tags | default([])) or 'hostname' in (ansible_run_tags | default([]))"
    - hostname_check is defined
    - mount_check is defined
    - etc_hosts_check is defined

- name: "FACT: Normalize users and groups data"
  ansible.builtin.set_fact:
    db_validation_data: >-
      {{
        db_validation_data
        | combine(
            {
              'users': dict(user_id_check.stdout_lines | map('split', ':', 1) | list),
              'groups': dict(group_id_check.stdout_lines | map('split', ':', 1) | list),
              'validation_users': validation_users,
              'validation_groups': validation_groups
            }
          )
      }}
  when:
    - "'all' in (ansible_run_tags | default(['all'])) or 'collect' in (ansible_run_tags | default([])) or 'users' in (ansible_run_tags | default([])) or 'groups' in (ansible_run_tags | default([]))"
    - user_id_check is defined
    - group_id_check is defined

- name: "FACT: Normalize root crontab data"
  ansible.builtin.set_fact:
    db_validation_data: >-
      {{
        db_validation_data
        | combine(
            {
              'root_crontab': root_crontab_check.stdout | default(''),
              'cron_patterns': cron_pattern_list
            }
          )
      }}
  when:
    - "'all' in (ansible_run_tags | default(['all'])) or 'collect' in (ansible_run_tags | default([])) or 'cron' in (ansible_run_tags | default([]))"
    - root_crontab_check is defined

- name: "FACT: Normalize Diagnostic Agent data"
  ansible.builtin.set_fact:
    db_validation_data: >-
      {{
        db_validation_data
        | combine(
            {
              'diagnostic_agent': diagnostic_agent_check.stdout | trim
            }
          )
      }}
  when:
    - "'all' in (ansible_run_tags | default(['all'])) or 'collect' in (ansible_run_tags | default([])) or 'diagnostic_agent' in (ansible_run_tags | default([]))"
    - diagnostic_agent_check is defined

- name: "FACT: Normalize HANA version and plug-in data"
  ansible.builtin.set_fact:
    db_validation_data: >-
      {{
        db_validation_data
        | combine(
            {
              'hana_db_version': hana_db_version_check.stdout | default(''),
              'hana_db_version_number': hana_db_version_number | default(''),
              'hana_db_version_rc': hana_db_version_check.rc | default(1),
              'hana_plugin_inventory': hana_plugin_inventory_check.stdout_lines | default([])
            }
          )
      }}
  when:
    - "'all' in (ansible_run_tags | default(['all'])) or 'collect' in (ansible_run_tags | default([])) or 'hana' in (ansible_run_tags | default([]))"
    - hana_db_version_check is defined
    - hana_plugin_inventory_check is defined

- name: "FACT: Normalize HANA SLD registration flags"
  ansible.builtin.set_fact:
    db_validation_data: >-
      {{
        db_validation_data
        | combine(
            {
              'hana_sld_registration_required': hana_sld_registration_required | bool,
              'hana_sld_registration_confirmed': hana_sld_registration_confirmed | bool
            }
          )
      }}
  when:
    - "'all' in (ansible_run_tags | default(['all'])) or 'collect' in (ansible_run_tags | default([])) or 'sld' in (ansible_run_tags | default([]))"

- name: "FACT: Normalize ClamSAP validation data"
  ansible.builtin.set_fact:
    db_validation_data: >-
      {{
        db_validation_data
        | combine(
            {
              'clamsap_package_status': clamsap_package_check.stdout,
              'clamsap_runtime_status': clamsap_runtime_check.stdout | default('')
            }
          )
      }}
  when:
    - "'all' in (ansible_run_tags | default(['all'])) or 'collect' in (ansible_run_tags | default([])) or 'packages' in (ansible_run_tags | default([])) or 'clamsap' in (ansible_run_tags | default([]))"
    - clamsap_package_check is defined
    - clamsap_runtime_check is defined

- name: "FACT: Normalize ClamAV daemon validation data"
  ansible.builtin.set_fact:
    db_validation_data: >-
      {{
        db_validation_data
        | combine(
            {
              'clamav_installed_packages':
                clamav_installed_packages | default([]),

              'clamav_detected_services':
                clamav_detected_services | default([]),

              'clamav_service_results':
                clamav_service_results | default([]),

              'clamav_installed':
                clamav_installed | default(false),

              'clamav_service_found':
                clamav_service_found | default(false),

              'clamav_service_enabled':
                clamav_service_enabled | default(false),

              'clamav_service_running':
                clamav_service_running | default(false),

              'clamav_validation_passed':
                clamav_validation_passed | default(false)
            }
          )
      }}
  when:
    - >
      'all' in (ansible_run_tags | default(['all']))
      or 'collect' in (ansible_run_tags | default([]))
      or 'packages' in (ansible_run_tags | default([]))
      or 'clamav' in (ansible_run_tags | default([]))
    - clamav_validation_passed is defined

- name: "FACT: Normalize Watchman validation data"
  ansible.builtin.set_fact:
    db_validation_data: >-
      {{
        db_validation_data
        | combine(
            {
              'watchman_package_status': watchman_package_check.stdout,
              'watchman_runtime_status': watchman_runtime_check.stdout | default('')
            }
          )
      }}
  when:
    - "'all' in (ansible_run_tags | default(['all'])) or 'collect' in (ansible_run_tags | default([])) or 'packages' in (ansible_run_tags | default([])) or 'watchman' in (ansible_run_tags | default([]))"
    - watchman_package_check is defined
    - watchman_runtime_check is defined
